<!--
  Enquiry popup, available on every page.

  Opened by anything carrying `data-enquiry-open`. Built on <dialog>, so the
  browser handles the backdrop, focus trapping, inert background and Escape -
  none of that needs writing or maintaining.
-->
<dialog class="enquiry-modal" data-enquiry-modal aria-labelledby="modal-heading">
  <div class="enquiry-modal-head">
    <div>
      <p class="eyebrow text-gold-400">
        <svg class="icon" aria-hidden="true"><use href="#i-trishul"/></svg> Free quote
      </p>
      <h2 id="modal-heading" class="text-xl text-white mt-1">Plan your yatra</h2>
    </div>
    <button type="button" class="enquiry-modal-close" data-enquiry-close aria-label="Close">
      <svg class="icon text-xl" aria-hidden="true"><use href="#i-x"/></svg>
    </button>
  </div>

  <div class="enquiry-modal-body">
    <!--@include enquiry-form.html prefix=modal-->
  </div>
</dialog>
