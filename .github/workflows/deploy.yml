name: Build & Deploy

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push and PR builds. A broken build never reaches a server.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # develop -> dev build (noindex, unminified for debugging)
      # main    -> prod build (minified, indexable)
      - name: Build
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npm run build:prod
          else
            npm run build
          fi

      - name: Guard - dev build must not be indexable
        if: github.ref != 'refs/heads/main'
        run: |
          grep -q "Disallow: /" dist/robots.txt
          grep -q "noindex" dist/index.html
          echo "dev build is noindex - ok"

      - name: Guard - prod build must be indexable
        if: github.ref == 'refs/heads/main'
        run: |
          grep -q "Allow: /" dist/robots.txt
          ! grep -q "noindex" dist/index.html
          echo "prod build is indexable - ok"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

      # The theme ships the same CSS/JS, built into wp-theme/gangotri/assets.
      - name: Build theme assets
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npm run build:theme:prod
          else
            npm run build:theme
          fi

      - name: Guard - theme manifest must exist
        run: test -s wp-theme/gangotri/assets/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: theme-${{ github.sha }}
          path: wp-theme/gangotri
          retention-days: 7

  # gangotri.codevani.com - auto-deploys on every push to develop
  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://www.gangroti.codevani.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: theme-${{ github.sha }}
          path: theme

      - name: Guard - the theme path must be set and must be a theme folder
        env:
          THEME_PATH: ${{ secrets.DEV_FTP_THEME_PATH }}
        run: |
          case "$THEME_PATH" in
            */wp-content/themes/*) echo "target ok" ;;
            *) echo "DEV_FTP_THEME_PATH is empty or not a theme folder"; exit 1 ;;
          esac

      # Only the theme folder is synced. WordPress core, uploads and the
      # database are the server's own - nothing here touches them.
      - name: Deploy theme over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./theme/
          server-dir: ${{ secrets.DEV_FTP_THEME_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

  # gangotriexpeditions.in - requires a manual approval on the
  # `production` environment (set required reviewers in repo settings).
  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gangotriexpeditions.in
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: theme-${{ github.sha }}
          path: theme

      # An empty server-dir makes the action default to the account root, and
      # it syncs by deleting whatever the artifact does not contain. On this
      # host that root is the live site. The deploy is not allowed to start
      # until the secret names an actual theme folder.
      - name: Guard - the theme path must be set and must be a theme folder
        env:
          THEME_PATH: ${{ secrets.PROD_FTP_THEME_PATH }}
        run: |
          case "$THEME_PATH" in
            */wp-content/themes/*) echo "target ok" ;;
            *) echo "PROD_FTP_THEME_PATH is empty or not a theme folder"; exit 1 ;;
          esac

      - name: Deploy theme over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PROD_FTP_SERVER }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./theme/
          server-dir: ${{ secrets.PROD_FTP_THEME_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
